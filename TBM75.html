body{margin:0;background:#f4f5fa;color:#12233d;font-family:Arial,"Malgun Gothic",sans-serif;padding-top:108px}

.nav{margin-left:auto;display:flex;gap:27px;align-items:center;font-weight:700;font-size:18px}.nav a,.nav span{white-space:nowrap;padding:11px 8px;border-radius:24px;color:#17213d;text-decoration:none;transition:.2s}.nav a:hover,.nav span:hover{background:#f57b42;color:#fff}

@media(max-width:950px){body{padding-top:130px}.top{top:10px;left:15px;right:15px;height:auto;min-height:90px;flex-wrap:wrap;gap:12px}.nav{width:100%;justify-content:space-between;font-size:12px}}
.tbm75-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(5,1fr);gap:16px;margin:28px 30px 34px;padding:0;}
.tbm75-cell{min-height:232px;aspect-ratio:1/1.6;border:1px solid #d1dce7;border-radius:12px;background:#fff;box-shadow:0 5px 16px #14213d12;display:flex;align-items:center;justify-content:center;color:#8da0b2;font-size:14px;overflow:hidden;}
.tbm75-cell:hover{border-color:#1875b5;box-shadow:0 6px 18px #1875b533;}
@media(max-width:1100px){.tbm75-grid{grid-template-columns:repeat(5,minmax(0,1fr));}}
@media(max-width:750px){.tbm75-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 15px}.tbm75-cell{min-height:192px;}}
@media(max-width:480px){.tbm75-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
.tbm75-cell{position:relative;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;padding:0;}
.tbm75-meta{display:flex;align-items:center;justify-content:space-between;gap:5px;width:100%;min-height:34px;padding:6px 7px;border-bottom:1px solid #d1dce7;background:#f8fafc;font-size:10px;color:#71869c;white-space:nowrap;}
.tbm75-date{overflow:hidden;text-overflow:ellipsis}.tbm75-controls{display:flex;align-items:center;gap:5px;color:#173653}.tbm75-dday{font-weight:800;color:#f57b42}.tbm75-lock,.tbm75-delete{display:inline-flex;align-items:center;gap:2px;font-size:9px}.tbm75-lock input,.tbm75-delete input{width:14px;height:14px;margin:0;accent-color:#1875b5}.tbm75-delete input{accent-color:#e34b4b}.tbm75-content{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;width:100%;overflow:hidden}.tbm75-content img{width:100%;height:100%;object-fit:contain}
</style>

<script id="tbm75-panel-persistence">(function(){var key='tbm75-panels-v1',cells=[].slice.call(document.querySelectorAll('.tbm75-cell'));function read(){try{return JSON.parse(localStorage.getItem(key)||'[]').filter(Boolean).sort(function(a,b){return Number(b.uploadedAt||0)-Number(a.uploadedAt||0)})}catch(e){return[]}}function save(a){try{localStorage.setItem(key,JSON.stringify(a))}catch(e){}}function format(ts){return new Date(ts).toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'})}function dayLeft(exp){return Math.ceil((exp-Date.now())/86400000)}function render(cell,index,data){var meta=cell.querySelector('.tbm75-meta'),content=cell.querySelector('.tbm75-content'),lock=cell.querySelector('.tbm75-lock input'),del=cell.querySelector('.tbm75-delete input'),dday=cell.querySelector('.tbm75-dday'),date=cell.querySelector('.tbm75-date');if(!data){date.textContent='업로드 없음';dday.textContent='';content.innerHTML='<button type="button" class="tbm75-upload-btn">파일 선택</button>';lock.checked=false;del.checked=false;return}date.textContent='업로드 '+format(data.uploadedAt);lock.checked=!!data.protected;del.checked=false;var left=dayLeft(data.expiresAt);dday.textContent=data.protected?'':('D-'+Math.max(0,left));content.innerHTML='';if(data.url){var img=document.createElement('img');img.src=data.url;img.alt=data.name||'업로드 이미지';content.appendChild(img)}else{content.innerHTML='<button type="button" class="tbm75-upload-btn">파일 선택</button>'}}function setup(cell,index){cell.innerHTML='<div class="tbm75-meta"><span class="tbm75-date">업로드 없음</span><span class="tbm75-controls"><span class="tbm75-dday"></span><label class="tbm75-lock"><input type="checkbox">삭제금지</label><label class="tbm75-delete"><input type="checkbox">삭제</label></span></div><div class="tbm75-content"><button type="button" class="tbm75-upload-btn">파일 선택</button></div><input class="tbm75-file" type="file" accept="image/*">';var input=cell.querySelector('.tbm75-file');cell.addEventListener('click',function(e){var btn=e.target.closest('.tbm75-upload-btn');if(btn){e.preventDefault();input.click()}});input.addEventListener('change',function(){var f=input.files&&input.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var a=read();a[index]={name:f.name,url:r.result,uploadedAt:Date.now(),expiresAt:Date.now()+30*86400000,protected:false};save(a);render(cell,index,a[index])};r.readAsDataURL(f)});cell.querySelector('.tbm75-lock input').addEventListener('change',function(){var a=read();if(!a[index])return;a[index].protected=this.checked;save(a);render(cell,index,a[index])});cell.querySelector('.tbm75-delete input').addEventListener('change',function(){if(!this.checked)return;var a=read();a[index]=null;save(a);input.value='';render(cell,index,null)});var a=read(),d=a[index];if(d&&!d.protected&&Date.now()>d.expiresAt){a[index]=null;save(a);d=null}render(cell,index,d)}cells.forEach(setup);setInterval(function(){var a=read(),changed=false;cells.forEach(function(cell,index){var d=a[index];if(d&&!d.protected&&Date.now()>d.expiresAt){a[index]=null;changed=true;render(cell,index,null)}else if(d){render(cell,index,d)}});if(changed)save(a)},60000)})();</script>
</body>
<script id="tbm75-remove-file-selection">(function(){document.querySelectorAll('.tbm75-upload-btn,.tbm75-file').forEach(function(el){el.remove()})})();</script>
<script id="tbm75-preview-zoom">(function(){document.addEventListener("dblclick",function(e){var img=e.target.closest(".tbm75-content img");if(!img)return;var layer=document.createElement("div");layer.style.cssText="position:fixed;inset:0;z-index:9999;background:#071827dd;display:flex;align-items:center;justify-content:center;padding:30px;cursor:zoom-out";var big=document.createElement("img");big.src=img.src;big.alt=img.alt;big.style.cssText="max-width:95vw;max-height:95vh;object-fit:contain";layer.appendChild(big);layer.onclick=function(){layer.remove()};document.body.appendChild(layer)});window.addEventListener("storage",function(e){if(e.key==="tbm75-panels-v1")location.reload()})})();</script><script id="current-page-nav-script">(function(){var current=(location.pathname.split("/").pop()||"index.html").toLowerCase();document.querySelectorAll(".nav .active").forEach(function(x){x.classList.remove("active")});document.querySelectorAll(".nav a").forEach(function(a){var href=(a.getAttribute("href")||"").split("?")[0].split("#")[0].toLowerCase();if(href&&href===current){a.classList.add("current-page");var data=a.closest(".data");if(data)data.classList.add("current-page")}})})();</script></html>
<script id="tbm75-server-image-sync">(function(){document.querySelectorAll(".tbm75-file").forEach(function(input){input.addEventListener("change",async function(){var f=input.files&&input.files[0];if(!f)return;try{var r=await fetch("/api/upload-image",{method:"POST",headers:{"Content-Type":f.type,"X-Upload-Folder":"ai-v2-tbm75","X-Upload-Page":"ai-v2/tbm75","X-Upload-Slot":String([].slice.call(document.querySelectorAll(".tbm75-file")).indexOf(input)),"X-File-Name":f.name},body:f}),d=await r.json();if(!r.ok||!d.url)throw Error("upload failed");var files=[].slice.call(document.querySelectorAll(".tbm75-file")),slot=files.indexOf(input),a=JSON.parse(localStorage.getItem("tbm75-panels-v1")||"[]");a[slot]=Object.assign({},a[slot]||{},{name:f.name,url:d.url,uploadedAt:Date.now(),expiresAt:Date.now()+30*86400000});localStorage.setItem("tbm75-panels-v1",JSON.stringify(a));window.dispatchEvent(new StorageEvent("storage",{key:"tbm75-panels-v1"}))}catch(e){console.warn("TBM75 server image sync failed",e)}})})})();</script><script id="tbm75-promote-top-left-to-server">(async function(){try{var a=JSON.parse(localStorage.getItem("tbm75-panels-v1")||"[]").filter(Boolean).sort(function(x,y){return Number(y.uploadedAt||0)-Number(x.uploadedAt||0)}),d=a[0];if(!d||!String(d.url||"").startsWith("data:"))return;var blob=await fetch(d.url).then(function(r){return r.blob()});var r=await fetch("/api/upload-image",{method:"POST",headers:{"Content-Type":blob.type||"image/png","X-Upload-Folder":"ai-v2-tbm75","X-Upload-Page":"ai-v2/tbm75","X-Upload-Slot":"0","X-File-Name":d.name||"tbm75-top-left.png"},body:blob}),x=await r.json();if(!r.ok||!x.url)return;d.url=x.url;localStorage.setItem("tbm75-panels-v1",JSON.stringify([d].concat(a.slice(1))))}catch(e){console.warn("TBM75 top-left sync failed",e)}})();</script><script id="tbm75-central-state-sync">(function(){var page='tbm75',key='tbm75-panels-v1',loading=false;function read(){try{return JSON.parse(localStorage.getItem(key)||'[]').filter(Boolean).sort(function(a,b){return Number(b.uploadedAt||0)-Number(a.uploadedAt||0)})}catch(e){return[]}}function save(){if(loading)return;fetch('/api/tbm-state?page='+page,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:read()})}).catch(function(){})}async function load(){try{var r=await fetch('/api/tbm-state?page='+page,{cache:'no-store'}),d=await r.json();if(!Array.isArray(d.state)||!d.state.length)return;var remote=JSON.stringify(d.state),local=JSON.stringify(read());if(remote!==local&&!sessionStorage.getItem('tbm75-cloud-loaded')){loading=true;localStorage.setItem(key,remote);sessionStorage.setItem('tbm75-cloud-loaded','1');location.reload()}}catch(e){}}window.addEventListener('storage',function(e){if(e.key===key)setTimeout(save,100)});setInterval(save,3000);setTimeout(load,700)})();</script>
