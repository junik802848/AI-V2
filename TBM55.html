</style></head><body><header class="top"><a class="brand" href="TBM20.html"><img src="assets/ai-logo.png"><span>AI Safety TBM Maker<small class="brand-sub">STEEL PLANT · CONTINUOUS CASTING SAFETY</small></span></a><nav class="nav"><span class="data">데이터<div class="submenu"><a href="TBM80.html">TBM 추가</a><a href="TBM72.html">체크리스트 추가</a><a href="TBM73.html">TBM 기타서류</a><a href="TBM75.html">TBM데이터</a></div></span><a href="TBM30.html">TBM 자동추출</a><a href="TBM40.html">TBM 용지확인</a><a class="current" href="TBM55.html">TBM 교육자료</a><a href="TBM60.html">교육 및 전달사항</a></nav></header><main class="page"><div class="layout"><section><div class="panel check-panel"><div class="title">작업자 체크리스트<span><button class="btn extract">자동추출</button><button class="btn reset">초기화</button></span></div><div class="rows"></div></div><div class="panel check-panel"><div class="title">작업 체크리스트<span><button class="btn extract">자동추출</button><button class="btn reset">초기화</button></span></div><div class="rows"></div></div></section><section class="panel case"><div class="title">사내 사고사례</div><div class="case-view"></div><div class="case-body"><h3 contenteditable="true" class="editable">사고사례 제목을 입력하세요</h3><div contenteditable="true" class="editable">사고사례 내용을 입력하세요</div><h3 contenteditable="true" class="editable">TBM 예방대책</h3><div contenteditable="true" class="editable">예방대책 내용을 입력하세요</div><p contenteditable="true" class="editable">재해발생 상황을 입력하세요</p><div id="status" class="status">서버 저장 준비 중</div></div></section></div></main><script>(function(){var api='/api/tbm-state?page=tbm55',state={groups:[[],[]],case:[]},ready=false;function rows(g,items){g.innerHTML='';for(var i=0;i<6;i++){var v=items[i]||{text:'',checked:false},l=document.createElement('label');l.className='row';l.innerHTML='<input type="checkbox"><span contenteditable="true"></span>';l.querySelector('input').checked=!!v.checked;l.querySelector('span').textContent=v.text||'';g.append(l)}}function snap(){return{groups:[...document.querySelectorAll('.rows')].map(g=>[...g.querySelectorAll('.row')].map(r=>({text:r.querySelector('span').textContent,checked:r.querySelector('input').checked}))),case:[...document.querySelectorAll('.case-body [contenteditable]')].map(x=>x.innerHTML)}}function save(){if(!ready)return;state=snap();fetch(api,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({state})}).then(r=>document.getElementById('status').textContent=r.ok?'중앙 저장 완료':'중앙 저장 실패').catch(()=>document.getElementById('status').textContent='중앙 저장 실패')}function apply(s){var gs=document.querySelectorAll('.rows');(s.groups||[[],[]]).forEach((a,i)=>rows(gs[i],a));(s.case||[]).forEach((v,i)=>{var x=document.querySelectorAll('.case-body [contenteditable]')[i];if(x)x.innerHTML=v})}async function load(){try{var r=await fetch(api,{cache:'no-store'}),d=await r.json();if(d.state){state=d.state;apply(state)}else{rows(document.querySelectorAll('.rows')[0],[]);rows(document.querySelectorAll('.rows')[1],[])}ready=true;document.getElementById('status').textContent='중앙 저장 연결 완료'}catch(e){ready=true;document.getElementById('status').textContent='중앙 저장 연결 실패'}}function randomize(a,n){var x=a.filter(v=>v&&v.checked),y=a.filter(v=>v&&!v.checked).sort(()=>Math.random()-.5);return x.concat(y).slice(0,n)}async function extract(card){var s=card.closest('section'),idx=[...s.querySelectorAll('.panel')].indexOf(card),box=card.querySelector('.rows');try{var r=await fetch('/api/tbm-state?page=tbm72',{cache:'no-store'}),d=await r.json(),g=Array.isArray(d.state)?d.state[idx]:(d.state&&d.state.groups?d.state.groups[idx]:null);if(!Array.isArray(g))throw Error('TBM72 체크리스트가 없습니다.');rows(box,randomize(g,6));save()}catch(e){document.getElementById('status').textContent='자동추출 실패: '+e.message}}document.addEventListener('input',()=>setTimeout(save,200));document.addEventListener('change',()=>setTimeout(save,200));document.querySelectorAll('.extract').forEach(b=>b.onclick=()=>extract(b.closest('.panel')));document.querySelectorAll('.reset').forEach(b=>b.onclick=()=>{var box=b.closest('.panel').querySelector('.rows');rows(box,[]);save()});load()})();</script></body></html>
