<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR코드 생성</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7fb;font-family:Arial,"Malgun Gothic",sans-serif;color:#12304b}.card{max-width:720px;margin:60px auto;padding:28px;background:#fff;border:1px solid #cbd9e7;border-radius:16px;box-shadow:0 6px 22px #14213d18}h1{color:#123f68}.choices{display:flex;gap:12px;margin:25px 0}button,a{padding:12px 20px;border:0;border-radius:8px;background:#1875b5;color:#fff;font-weight:bold;font-size:17px;cursor:pointer;text-decoration:none}#steel,a{background:#f57b42}.result{min-height:300px;border:1px dashed #bfd0df;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:20px}.result img{width:280px;height:280px}.error{color:#c33}</style></head><body><main class="card"><h1>QR코드 생성</h1><p>제강 또는 연주를 선택하세요.</p><div class="choices"><button id="steel">제강</button><button id="casting">연주</button></div><div id="result" class="result">연주를 누르면 TBM40 최근 TBM 용지 QR코드가 생성됩니다.</div><br><a href="TBM20.html">TBM으로 이동</a></main><script>document.getElementById('casting').onclick=async function(){var r=document.getElementById('result');r.textContent='QR코드 생성 중...';try{var x=await fetch('/api/qr?text='+encodeURIComponent(location.origin+'/TBM40.html'),{cache:'no-store'});if(!x.ok)throw Error();var u=URL.createObjectURL(await x.blob()),i=document.createElement('img');i.src=u;i.alt='TBM40 QR코드';r.innerHTML='';r.append(i)}catch(e){r.innerHTML='<span class="error">QR 생성에 실패했습니다.</span>'}};document.getElementById('steel').onclick=function(){document.getElementById('result').textContent='제강 QR코드는 준비 중입니다.'};</script></body></html>
