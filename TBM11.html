<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Safety TBM Maker · 공정 선택</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#061521 url('assets/tbm20-hero.png') center/cover fixed;color:#fff;font-family:Arial,"Malgun Gothic",sans-serif}body:after{content:"";position:fixed;inset:0;background:linear-gradient(90deg,#03101bd9,#031827b8),#06152166;z-index:0}.screen{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}.eyebrow{color:#ff7135;font-size:18px;font-weight:800;letter-spacing:2px}.screen h1{font-size:52px;margin:26px 0 22px;background:linear-gradient(90deg,#fff 0%,#ffd1a8 45%,#fff 70%);background-size:220% auto;background-clip:text;-webkit-background-clip:text;color:transparent;text-shadow:0 0 18px #ff8a4d88;animation:title-in 1s cubic-bezier(.2,.8,.2,1) both,title-shine 4s ease-in-out 1s infinite}@keyframes title-in{from{opacity:0;transform:translateY(22px) scale(.94);filter:blur(8px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}@keyframes title-shine{0%,100%{background-position:0 50%;text-shadow:0 0 14px #ff8a4d66}50%{background-position:100% 50%;text-shadow:0 0 30px #ff9d67cc}}.screen p{font-size:20px;color:#e1eaf1;margin:0 0 26px}.processes{display:flex;gap:28px}.process{position:relative;width:340px;height:300px;border:1px solid #ffffff80;border-radius:18px;overflow:hidden;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#fff;font-size:40px;font-weight:900;text-shadow:0 3px 10px #000;cursor:pointer;transition:.2s}.process:after{content:"";position:absolute;inset:0;background:#0005}.process span{position:relative;z-index:1}.process:hover{transform:translateY(-6px);border-color:#ffad70;box-shadow:0 12px 30px #0008}.steel{background-image:url('assets/process-steelmaking.png')}.casting{background-image:url('assets/process-continuous-casting.png')}.hint{margin-top:26px;color:#ff7135;font-size:17px;font-weight:800;letter-spacing:2px}.qr-modal{position:fixed;inset:0;z-index:5;background:#03111eea;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}.qr-card{background:#fff;color:#12304b;border-radius:16px;padding:25px;text-align:center;cursor:default}.qr-card img{display:block;width:280px;height:280px;margin:15px auto}.qr-card button{padding:10px 18px;border:0;border-radius:8px;background:#f57b42;color:#fff;font-weight:bold;cursor:pointer}@media(max-width:760px){.screen h1{font-size:38px}.processes{flex-direction:column}.process{width:min(340px,85vw);height:230px;font-size:32px}}</style></head><body><main class="screen"><div class="eyebrow">AI SAFETY · FIELD CONTROL</div><h1>공정을 선택하세요</h1><p>현장을 선택하여 QR코드로 TBM 용지를 확인하세요</p><div class="processes"><div class="process steel" id="steel"><span>제강</span></div><div class="process casting" id="casting"><span>연주</span></div></div><div class="hint">SELECT A PROCESS</div></main><script>(function(){async function qr(path,title){var m=document.createElement('div');m.className='qr-modal';m.innerHTML='<div class="qr-card"><h2>'+title+' TBM QR코드</h2><div>스캔하면 최근 TBM 용지로 이동합니다.</div><div class="loading">생성 중...</div><button>닫기</button></div>';m.onclick=function(e){if(e.target===m)m.remove()};m.querySelector('button').onclick=function(){m.remove()};document.body.append(m);try{var target=location.origin+path;try{var latest=await fetch('/api/tbm-state?page=tbm40',{cache:'no-store'}).then(function(v){return v.json()});var state=latest.state||{},item=state['tbm40-latest-image-v2']||state['tbm40-shared-image-url'],imageUrl=typeof item==='string'?item:(item&&item.url);if(imageUrl)target=location.origin+'/TBM40.html?qr=latest';else throw Error('TBM40에 업로드된 최신 이미지가 없습니다.')}catch(e){}var r=await fetch('/api/qr?text='+encodeURIComponent(target),{cache:'no-store'});if(!r.ok)throw Error();var i=document.createElement('img');i.src=URL.createObjectURL(await r.blob());i.alt=title+' TBM QR코드';m.querySelector('.loading').replaceWith(i)}catch(e){m.querySelector('.loading').textContent='QR 생성에 실패했습니다.'}}document.getElementById('casting').onclick=function(){qr('/TBM40.html','연주')};document.getElementById('steel').onclick=function(){qr('/TBM40.html','제강')}})();</script></body></html>
