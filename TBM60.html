<script id="education-persistence">(()=>{const key="tbm60-education-data";function read(){try{return JSON.parse(localStorage.getItem(key)||"[]")}catch(e){return[]}}function save(){const data=[...document.querySelectorAll("#educationGrid .edu-card")].map(card=>({period:card.querySelector(".period").value,cycle:card.querySelector(".cycle").value,image:card.querySelector(".edu-image img")?.src||""}));localStorage.setItem(key,JSON.stringify(data))}function bind(){document.querySelectorAll("#educationGrid select,#educationGrid .remove-card input").forEach(x=>x.addEventListener("change",save))}function restore(){const data=read();if(!data.length)return;const grid=document.getElementById("educationGrid");grid.innerHTML="";data.forEach(item=>{document.getElementById("addEducation").click();const card=grid.lastElementChild;card.querySelector(".period").value=item.period;card.querySelector(".cycle").value=item.cycle;if(item.image){const box=card.querySelector(".edu-image");box.innerHTML="";const img=document.createElement("img");img.src=item.image;box.append(img)} });bind()}document.addEventListener("change",e=>{if(e.target.matches("#educationGrid input[type=file]")&&e.target.files[0]){const reader=new FileReader();reader.onload=()=>{const box=e.target.closest(".edu-card").querySelector(".edu-image");box.innerHTML="";const img=document.createElement("img");img.src=reader.result;box.append(img);save()};reader.readAsDataURL(e.target.files[0])}if(e.target.matches("#educationGrid select"))save();if(e.target.matches(".remove-card input")&&e.target.checked){const card=e.target.closest(".edu-card");card.querySelector(".edu-image").innerHTML="교육 이미지를 선택해 주세요";card.querySelector(".period").value="0";card.querySelector(".cycle").value="0";e.target.checked=false;save()}});const old=window.setInterval;setTimeout(restore,100);setInterval(()=>{bind();save()},1000);})();</script>




<style id="interaction-style">body{cursor:none!important}.custom-cursor{position:fixed;width:14px;height:14px;background:#f00;border-radius:50%;pointer-events:none;z-index:99999;transform:translate(-50%,-50%)}.ripple{position:fixed;width:9px;height:9px;border:3px solid #f00;border-radius:50%;pointer-events:none;z-index:99998;transform:translate(-50%,-50%);animation:rip 2.5s ease-out forwards}@keyframes rip{to{width:90px;height:90px;opacity:0}}</style><script id="interaction-script">(function(){var c=document.createElement("div"),v=document.createElement("canvas"),x=v.getContext("2d"),down=false,points=[],lines=[];c.className="custom-cursor";document.body.appendChild(c);v.style.cssText="position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:99997";document.body.appendChild(v);function resize(){v.width=window.innerWidth;v.height=window.innerHeight}resize();window.addEventListener("resize",resize);window.addEventListener("pointermove",function(e){c.style.left=e.clientX+"px";c.style.top=e.clientY+"px";if(down){var last=points[points.length-1];points.push([e.clientX,e.clientY]);if(last){x.strokeStyle="#f00";x.lineWidth=3;x.lineCap="round";x.beginPath();x.moveTo(last[0],last[1]);x.lineTo(e.clientX,e.clientY);x.stroke()}}});window.addEventListener("pointerdown",function(e){if(e.button===0){down=true;points=[[e.clientX,e.clientY]]}});window.addEventListener("pointerup",function(e){if(e.button===0){if(points.length>1){var copy=[];for(var i=0;i<points.length;i++)copy.push(points[i]);lines.push({p:copy,t:Date.now()});}down=false;points=[]}});window.addEventListener("dblclick",function(e){var r=document.createElement("div");r.className="ripple";r.style.left=e.clientX+"px";r.style.top=e.clientY+"px";document.body.appendChild(r);setTimeout(function(){r.remove()},2600)});function draw(){var now=Date.now();x.clearRect(0,0,v.width,v.height);var kept=[];for(var i=0;i<lines.length;i++){var line=lines[i],age=now-line.t;if(age<5000){kept.push(line);x.strokeStyle="rgba(255,0,0,"+(1-age/5000)+")";x.lineWidth=3;x.lineCap="round";x.beginPath();for(var j=0;j<line.p.length;j++){var q=line.p[j];if(j===0)x.moveTo(q[0],q[1]);else x.lineTo(q[0],q[1])}x.stroke()}}lines=kept;if(down&&points.length>1){x.strokeStyle="#f00";x.lineWidth=3;x.lineCap="round";x.beginPath();for(var k=0;k<points.length;k++){var w=points[k];if(k===0)x.moveTo(w[0],w[1]);else x.lineTo(w[0],w[1])}x.stroke()}requestAnimationFrame(draw)}draw()})();</script>



<script id="period-countdown-tbm60">(function(){var key='tbm60-period-start-v2';function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()}function read(){try{return JSON.parse(localStorage.getItem(key)||'{}')}catch(e){return{}}}function save(x){localStorage.setItem(key,JSON.stringify(x))}function run(){var z=read(),now=today();document.querySelectorAll('#educationGrid .edu-card').forEach(function(c,i){var s=c.querySelector('.period');if(!s)return;var n=Number(s.value);if(!n)return;var start=z[i]&&z[i].start;if(!start||z[i].total!==n){start=now;z[i]={total:n,start:start}}var left=n-Math.floor((now-start)/86400000);s.value=left>0?String(left):'0'});save(z)}document.addEventListener('change',function(e){if(e.target.matches('#educationGrid .period')){var z=read(),i=Array.from(document.querySelectorAll('#educationGrid .period')).indexOf(e.target);z[i]={total:Number(e.target.value),start:today()};save(z);run()}},true);run();setInterval(run,60000)})();</script>
<script id="tbm60-central-state-sync">(function(){var page='tbm60',key='tbm60-education-data';function local(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return[]}}function snapshot(){return Array.from(document.querySelectorAll('#educationGrid .edu-card')).map(function(c){return{period:c.querySelector('.period')?.value||'0',cycle:c.querySelector('.cycle')?.value||'0',image:c.querySelector('.edu-image img')?.src||'',name:c.querySelector('h2')?.textContent||'교육사항'}})}function save(){var state=snapshot();try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}fetch('/api/tbm-state?page='+page,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:state})}).catch(function(){})}function restore(state){if(!Array.isArray(state)||!state.length)return;var grid=document.getElementById('educationGrid'),add=document.getElementById('addEducation');if(!grid||!add)return;grid.innerHTML='';state.forEach(function(v){add.click();var c=grid.lastElementChild;if(!c)return;c.querySelector('.period').value=v.period||'0';c.querySelector('.cycle').value=v.cycle||'0';if(v.image){var b=c.querySelector('.edu-image'),im=document.createElement('img');im.src=v.image;im.alt=v.name||'';b.innerHTML='';b.appendChild(im)}})}async function load(){try{var r=await fetch('/api/tbm-state?page='+page,{cache:'no-store'}),d=await r.json();if(d.state&&d.state.length)restore(d.state);else if(local().length)save()}catch(e){}}document.addEventListener('change',function(e){if(e.target.closest&&e.target.closest('#educationGrid'))setTimeout(save,50)},true);document.addEventListener('input',function(e){if(e.target.closest&&e.target.closest('#educationGrid'))setTimeout(save,50)},true);setInterval(save,2000);setTimeout(load,1200)})();</script>
