<script id="tbm73-local-image-save">(function(){var key='tbm73-documents';function read(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return[]}}function render(card,d){var box=card.querySelector('.preview');if(!box)return;box.innerHTML='';box.classList.add('has-file');if(d.type&&d.type.indexOf('image/')===0){var img=document.createElement('img');img.src=d.value;img.alt=d.name;box.appendChild(img)}else{var name=document.createElement('div');name.className='file-name';name.textContent=d.name;box.appendChild(name)}}document.querySelectorAll('.tbm73 .doc-card').forEach(function(card,index){var input=card.querySelector('.doc-file-input');if(!input)return;input.addEventListener('change',function(){var file=input.files&&input.files[0];if(!file||file.type.indexOf('image/')!==0)return;var reader=new FileReader();reader.onload=function(){var all=read();all[index]={name:file.name,type:file.type,value:reader.result};try{localStorage.setItem(key,JSON.stringify(all));render(card,all[index])}catch(e){var box=card.querySelector('.preview');if(box)box.textContent='이미지 저장 공간이 부족합니다.'}};reader.readAsDataURL(file)})});try{var all=read();document.querySelectorAll('.tbm73 .doc-card').forEach(function(card,index){if(all[index]&&all[index].value)render(card,all[index])})}catch(e){}})();</script>
<script id="tbm73-authoritative-upload">(function(){var remoteKey='tbm73-blob-docs-v1',localKey='tbm73-documents';function read(key){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return[]}}function show(card,d){var box=card.querySelector('.preview');if(!box)return;box.innerHTML='';box.classList.add('has-file');var src=d.url||d.value;if(d.type&&d.type.indexOf('image/')===0){var img=document.createElement('img');img.src=src;img.alt=d.name||'';box.appendChild(img)}else{var label=document.createElement('div');label.className='file-name';label.textContent=d.name||'저장된 파일';box.appendChild(label)}}function saveLocal(card,index,file){var reader=new FileReader();reader.onload=function(){var a=read(localKey);a[index]={name:file.name,type:file.type,value:reader.result};try{localStorage.setItem(localKey,JSON.stringify(a));show(card,a[index])}catch(e){card.querySelector('.preview').textContent='이미지 저장 공간이 부족합니다.'}};reader.readAsDataURL(file)}async function upload(card,index,file){var box=card.querySelector('.preview');box.textContent='업로드 중...';try{var r=await fetch('/api/upload-image',{method:'POST',headers:{'Content-Type':file.type,'X-Upload-Folder':'tbm73'},body:file});var d=await r.json();if(!r.ok||!d.url)throw Error(d.detail||d.error||'서버 업로드 실패');var a=read(remoteKey);a[index]={name:file.name,type:file.type,url:d.url};localStorage.setItem(remoteKey,JSON.stringify(a));show(card,a[index])}catch(e){saveLocal(card,index,file)}}function bind(){document.querySelectorAll('.tbm73 .doc-card').forEach(function(card,index){var input=card.querySelector('.doc-file-input');if(!input||input.dataset.authoritative)return;input.dataset.authoritative='1';input.addEventListener('change',function(e){var file=input.files&&input.files[0];if(!file)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();upload(card,index,file)},true)})}bind();var main=document.querySelector('.tbm73');if(main)new MutationObserver(bind).observe(main,{childList:true,subtree:true});document.querySelectorAll('.tbm73 .doc-card').forEach(function(card,index){var remote=read(remoteKey)[index],local=read(localKey)[index];if(remote&&remote.url)show(card,remote);else if(local&&local.value)show(card,local)})})();</script>







<script id="tbm73-central-state-sync">(function(){var page='tbm73',key='tbm73-blob-docs-v1';function snap(){return Array.from(document.querySelectorAll('.tbm73 .doc-card')).map(function(c){var p=c.querySelector('.preview'),img=p&&p.querySelector('img'),a=p&&p.querySelector('a');return img?{name:img.alt||'',type:'image/*',url:img.src}:a?{name:a.textContent.replace(/ 열기$/,''),type:'file',url:a.href}:null})}function show(c,d){var p=c&&c.querySelector('.preview');if(!p)return;p.innerHTML='';p.classList.toggle('has-file',!!d);if(!d)return;if((d.type||'').indexOf('image/')===0||/\.(png|jpe?g|webp|gif)(\?|$)/i.test(d.url||'')){var im=document.createElement('img');im.src=d.url;im.alt=d.name||'첨부 이미지';p.appendChild(im)}else{var a=document.createElement('a');a.href=d.url;a.target='_blank';a.className='file-name';a.textContent=(d.name||'저장된 파일')+' 열기';p.appendChild(a)}}function save(){var state=snap();try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}fetch('/api/tbm-state?page='+page,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:state})}).catch(function(){})}async function load(){try{var r=await fetch('/api/tbm-state?page='+page,{cache:'no-store'}),d=await r.json();if(Array.isArray(d.state)&&d.state.length){d.state.forEach(function(v,i){if(v)show(document.querySelectorAll('.tbm73 .doc-card')[i],v)})}else if(snap().some(Boolean))save()}catch(e){}}document.addEventListener('change',function(e){if(e.target.closest&&e.target.closest('.tbm73'))setTimeout(save,300)},true);setInterval(save,3000);setTimeout(load,900)})();</script>
