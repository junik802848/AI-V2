<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Safety TBM Maker · QR코드</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7fb;color:#12304b;font-family:Arial,"Malgun Gothic",sans-serif}.card{max-width:720px;margin:60px auto;padding:28px;background:#fff;border:1px solid #cbd9e7;border-radius:16px;box-shadow:0 6px 22px #14213d18}h1{margin:0 0 8px;color:#123f68}p{color:#60788c}label{display:block;margin:22px 0 8px;font-weight:700}textarea{width:100%;min-height:90px;padding:12px;border:1px solid #b8cbd9;border-radius:8px;font:15px Arial,"Malgun Gothic",sans-serif;resize:vertical}button,a{display:inline-block;margin-top:14px;padding:12px 18px;border:0;border-radius:8px;background:#1875b5;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}a{background:#f57b42;margin-left:8px}.result{min-height:300px;margin-top:24px;border:1px dashed #bfd0df;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:20px}.result img{width:280px;height:280px}.error{color:#c33;font-weight:700}</style></head><body><main class="card"><h1>QR코드 생성</h1><p>주소 또는 문구를 입력한 뒤 생성 버튼을 누르세요.</p><label for="qrText">QR 내용</label><textarea id="qrText"></textarea><div><button id="generate" type="button">QR코드 생성</button><a href="TBM20.html">TBM으로 이동</a></div><div id="result" class="result">생성된 QR코드가 여기에 표시됩니다.</div></main><script>(function(){var text=document.getElementById('qrText'),result=document.getElementById('result');text.value=location.origin+'/TBM40.html';document.getElementById('generate').onclick=async function(){var value=text.value.trim();if(!value){result.innerHTML='<span class="error">QR 내용을 입력하세요.</span>';return}result.textContent='생성 중...';try{var r=await fetch('/api/qr?text='+encodeURIComponent(value),{cache:'no-store'});if(!r.ok)throw Error('QR 생성에 실패했습니다.');var blob=await r.blob(),url=URL.createObjectURL(blob),img=document.createElement('img');img.src=url;img.alt='생성된 QR코드';result.innerHTML='';result.appendChild(img)}catch(e){result.innerHTML='<span class="error">'+e.message+'</span>'}};document.getElementById('generate').click()})();</script></body></html>
